name: Release & Publish Docker image
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/test.yml

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create release from tag
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

  image:
    name: Publish Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: daviddkppw/api-mitigation-test
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Update Docker Hub overview
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: daviddkppw/api-mitigation-test
          readme-filepath: ./README.md
          enable-url-completion: true

  action-tag:
    name: Update GitHub Action major tag
    needs: [release, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Move major version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          major="${RELEASE_TAG#v}"
          major="${major%%.*}"
          git tag --force "v${major}" "${RELEASE_SHA}"
          git push --force origin "refs/tags/v${major}:refs/tags/v${major}"
