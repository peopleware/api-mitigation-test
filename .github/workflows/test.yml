name: Tests

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*.*.*'
  workflow_call:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          cache: pip
      - name: Bootstrap patched pip with a verified wheel
        run: python -m pip --disable-pip-version-check install --no-cache-dir --no-index --no-deps --require-hashes -r requirements-bootstrap.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest==8.4.2
          python -m pip check
      - name: Run tests
        run: python -m pytest -q tests
