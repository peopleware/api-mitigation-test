name: Tests

on:
  push:
  workflow_call:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pytest==8.4.2
          python -m pip check
      - name: Run tests
        run: python -m pytest -q tests/test_runner.py
